name: Release

# Publishes `barkapay` to npm when a version tag (v*) is pushed.
#
# Authentication: npm TRUSTED PUBLISHING (OIDC). No npm token is stored in this
# repository: npm trusts this exact workflow file in this exact repository and
# hands it a short-lived credential for one publish. The version is published
# with a provenance attestation.
#
# ── First release of `barkapay` (2.0.0): NPM_TOKEN ──────────────────────────
#   npm only lets you attach a trusted publisher to a package that already
#   exists, so the very first version goes out with a token:
#   npmjs.com → Access Tokens → Generate New Token → Granular Access Token
#       Expiration       : 7 days
#       Packages/scopes  : Read and write — All packages (the package does
#                          not exist yet, it cannot be selected)
#       Organizations    : No access
#       "Bypass two-factor authentication": checked (CI cannot answer 2FA)
#   then GitHub → BarkaPay/barkapay-nodejs → Settings → Secrets and variables
#   → Actions → New repository secret, name NPM_TOKEN.
#   The repository must already be named `barkapay-nodejs` when the tag is
#   pushed: the provenance check compares it with `repository.url`.
#
# ── Every release after that: trusted publishing (OIDC) ─────────────────────
#   npmjs.com → Packages → barkapay → Settings → "Trusted Publisher"
#   → "Select your publisher": GitHub Actions, then:
#       Organization or user : BarkaPay          (case-sensitive)
#       Repository           : barkapay-nodejs
#       Workflow filename    : release.yml       (file name only, with .yml)
#       Environment name     : (leave empty)
#       Allowed actions      : enable `npm publish` (direct publishing);
#                              leave `npm dist-tag` disabled.
#   Then revoke the token on npmjs.com and delete the NPM_TOKEN secret: npm
#   tries OIDC first and falls back on NPM_TOKEN only when it exists. With
#   neither, the publish step fails with ENEEDAUTH and nothing is published.
#   Requirements (met below): GitHub-hosted runner, `id-token: write`,
#   Node >= 22.14 and npm >= 11.5.1, and `repository.url` in package.json
#   pointing at this repository.
#   Docs: https://docs.npmjs.com/trusted-publishers
#
# ── Cutting a release ────────────────────────────────────────────────────────
#   Bump the version (package.json, package-lock.json, src/version.ts), update
#   CHANGELOG.md, merge to main, then:
#       git tag -a v1.2.3 -m "v1.2.3" && git push origin v1.2.3

on:
  push:
    tags:
      - 'v*'

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    # Runs third-party code (the dev dependencies): no id-token, no secret.
    name: Verify and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tag must match the version (package.json, lockfile, src/version.ts)
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          lock="$(node -p "require('./package-lock.json').version")"
          src="$(sed -n "s/^export const VERSION = '\(.*\)';$/\1/p" src/version.ts)"
          echo "tag=$tag package.json=$pkg package-lock.json=$lock src/version.ts=$src"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$lock" ] || [ "$tag" != "$src" ]; then
            echo "::error::Tag v$tag does not match the version in package.json ($pkg), package-lock.json ($lock) and src/version.ts ($src)"
            exit 1
          fi
          if ! grep -q "^## \[$tag\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $tag"
            exit 1
          fi

      - name: Tag must point at a commit of main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main — refusing to publish."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false # never use caching in release builds

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: node scripts/audit.mjs

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Format (prettier)
        run: npm run format:check

      - name: Tests (vitest)
        run: npm test

      - name: Build (tsup)
        run: npm run build

      - name: Smoke test of the build
        run: npm run test:smoke

      - name: Package lint (publint)
        run: npx --yes publint@0.3.25 --strict

      - name: Type resolution for ESM and CJS consumers
        run: npx --yes @arethetypeswrong/cli@0.18.5 --pack .

      - name: Pack
        run: |
          npm pack --ignore-scripts
          tar -tzf barkapay-*.tgz | sort
          sha256sum barkapay-*.tgz

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: barkapay-*.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    # The only job allowed to mint an OIDC token. It runs no project code and
    # installs nothing: it publishes the tarball that `verify` built and tested.
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest # trusted publishing requires a GitHub-hosted runner
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC: trusted publishing + provenance
    steps:
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: npm must support trusted publishing (>= 11.5.1)
        run: |
          version="$(npm --version)"
          echo "node $(node --version), npm $version"
          lowest="$(printf '%s\n%s\n' "11.5.1" "$version" | sort -V | head -n 1)"
          if [ "$lowest" != "11.5.1" ]; then
            echo "::error::npm $version is older than 11.5.1, the first version with trusted publishing."
            exit 1
          fi

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Publish (trusted publishing, falling back on NPM_TOKEN)
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret: present (used only if trusted publishing is not configured)."
          else
            echo "NPM_TOKEN secret: absent — trusted publishing (OIDC) is the only way in."
          fi
          sha256sum barkapay-*.tgz
          npm publish ./barkapay-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
