name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The dev toolchain (eslint, vitest, vite) needs Node >= 20.19.
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Format (prettier)
        run: npm run format:check

      - name: Tests (vitest)
        run: npm test

      - name: Build (tsup)
        run: npm run build

      - name: Smoke test of the build (real fetch, loopback server)
        run: npm run test:smoke

  package:
    name: Package (audit, exports, types, tarball)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit

      - name: Registry signatures of the installed packages
        run: npm audit signatures

      - name: Build (tsup)
        run: npm run build

      - name: Package lint (publint)
        run: npx --yes publint@0.3.25 --strict

      - name: Type resolution for ESM and CJS consumers (are the types wrong?)
        run: npx --yes @arethetypeswrong/cli@0.18.5 --pack .

      - name: Pack
        run: |
          npm pack --ignore-scripts
          tar -tzf barkapay-*.tgz | sort

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: barkapay-*.tgz
          if-no-files-found: error
          retention-days: 7

  runtime:
    # What users actually install, on every supported Node — Node 18 included,
    # which the dev toolchain itself no longer supports.
    name: Installed package (Node ${{ matrix.node }})
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: smoke

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Install the tarball in an empty project
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer && cd consumer
          npm init --yes > /dev/null
          npm install --no-audit --no-fund ../package/barkapay-*.tgz
          # Zero runtime dependencies: the SDK must be the only thing installed.
          test "$(ls node_modules | wc -l)" -eq 1
          cp -R "$GITHUB_WORKSPACE/smoke" .

      - name: Smoke test — ES modules
        working-directory: ${{ runner.temp }}/consumer
        run: node smoke/esm.mjs

      - name: Smoke test — CommonJS
        working-directory: ${{ runner.temp }}/consumer
        run: node smoke/cjs.cjs
